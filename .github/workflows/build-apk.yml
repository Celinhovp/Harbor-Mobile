name: Sync APK from upstream release

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPO: "usuario/app"   # <- troque pelo repositório real

jobs:
  sync:
    runs-on: ubuntu-24.04

    steps:
      - name: Sync latest upstream release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Pega a release mais recente (inclui pre-releases, ignora drafts)
          TAG="$(gh release list --repo "$UPSTREAM_REPO" --limit 1 --exclude-drafts --json tagName -q '.[0].tagName')"

          if [ -z "$TAG" ]; then
            echo "O repositório $UPSTREAM_REPO não possui nenhuma release"
            exit 1
          fi

          NAME="$(gh release view "$TAG" --repo "$UPSTREAM_REPO" --json name -q .name)"
          echo "Ultima release do original: $TAG"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG ja existe no meu repositorio, nada a fazer"
            exit 0
          fi

          mkdir -p dl
          gh release download "$TAG" --repo "$UPSTREAM_REPO" --pattern "*.apk" --dir dl

          if ! ls dl/*.apk > /dev/null 2>&1; then
            echo "A release $TAG do original nao tem arquivo .apk"
            exit 1
          fi

          ls -lh dl

          gh release create "$TAG" dl/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "${NAME:-$TAG}" \
            --notes "APK sincronizado da release $TAG de $UPSTREAM_REPO"
