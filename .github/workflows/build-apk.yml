name: Build Android APK

on:
  push:
    branches:
      - beta-branch
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android wasm32-unknown-unknown

      - name: Install wasm-pack
        run: npm install -g wasm-pack

      - name: Build harbor-core (wasm)
        working-directory: harbor-core
        run: wasm-pack build --target bundler --out-dir pkg

      - name: Install Android SDK and NDK 27
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK" >> $GITHUB_ENV
          echo "ANDROID_NDK=$NDK" >> $GITHUB_ENV

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Android project
        run: |
          if [ -d "src-tauri/gen/android" ]; then
            echo "gen/android ja existe, pulando init"
          else
            pnpm android:init
          fi

      - name: Build Android APK (debug)
        env:
          # unrar_sys usa lutimes, que nao existe na API 24 do Android
          CXXFLAGS_aarch64_linux_android: "-Dlutimes=utimes"
          CFLAGS_aarch64_linux_android: "-Dlutimes=utimes"
        run: |
          set -o pipefail
          echo "NDK em uso: $NDK_HOME"
          pnpm android:build --debug --apk --target aarch64 --verbose 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          grep -nE "error(\[E[0-9]+\])?:|FAILURE|What went wrong|Caused by|panicked" build.log | head -60
          tail -80 build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-Android-APK
          path: src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: error
