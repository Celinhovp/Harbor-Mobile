      - name: Build Android APK (debug)
        run: |
          set -o pipefail
          pnpm android:build --debug --verbose 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          echo "=== LINHAS DE ERRO ==="
          grep -nE "error(\[E[0-9]+\])?:|FAILURE|What went wrong|Caused by|panicked|not found|could not" build.log | head -60
          echo "=== ULTIMAS 80 LINHAS ==="
          tail -80 build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
