name: Auto Sync Fork

on:
  schedule:
    - cron: '0 0 * * *' # Executa todos os dias à meia-noite
  workflow_dispatch: # Permite rodar manualmente

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessário para dar push na branch
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and sync
        run: |
          git remote add upstream https://github.com/9vsv6/Harbor.git
          git fetch upstream
          git checkout beta-branch
          git merge upstream/beta-branch --no-edit
          git push origin beta-branch
