name: Auto Sync Fork

on:
  schedule:
    - cron: '0 0 * * *' # Executa diariamente à meia-noite
  workflow_dispatch: # Permite executar manualmente no separador Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Obrigatório para o GitHub permitir atualizar o código
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: beta-branch
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream and merge
        run: |
          git remote add upstream https://github.com/9vsv6/Harbor.git
          git fetch upstream beta-branch:upstream-beta
          git checkout beta-branch
          git merge upstream-beta --no-edit
          git push origin beta-branch
